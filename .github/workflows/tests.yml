name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      mariadb:
        # La misma versión que el hosting de producción
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: kaloai_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, dom
          coverage: none

      - name: Instalar dependencias
        run: composer install --no-interaction --prefer-dist

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # El hosting no tiene Node: public/css/tailwind.css se sube ya compilado.
      # Si una vista usa una clase nueva y no se ha recompilado, esto falla.
      - name: Comprobar que el CSS de Tailwind está compilado y al día
        run: |
          npm ci --no-audit --no-fund
          npm run build:css
          git diff --exit-code public/css/tailwind.css || { echo "Ejecuta 'npm run build:css' y sube public/css/tailwind.css"; exit 1; }

      - name: Comprobar la sintaxis de todos los PHP
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Tests (unitarios y contra MariaDB)
        env:
          KALOAI_TEST_DB_NAME: kaloai_test
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASS: root
        # --fail-on-skipped: si la base de datos no estuviera disponible, los
        # tests de integración se saltarían; aquí eso cuenta como fallo
        run: vendor/bin/phpunit --fail-on-skipped
