<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0c0c0e">
    <title>Sin conexión · KaloAI</title>
    <style>
        :root { color-scheme: light dark; --bg: #f4f4f5; --card: #fff; --text: #18181b; --muted: #71717a; --brand: #0d9488; }
        @media (prefers-color-scheme: dark) { :root { --bg: #0c0c0e; --card: #151517; --text: #fafafa; --muted: #a1a1aa; --brand: #2dd4bf; } }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--text);
               font-family: "DM Sans", ui-sans-serif, system-ui, -apple-system, sans-serif; }
        main { max-width: 360px; text-align: center; background: var(--card); border-radius: 24px; padding: 32px 24px; }
        img { width: 72px; height: 72px; border-radius: 18px; }
        h1 { font-size: 1.35rem; margin: 20px 0 8px; }
        p { color: var(--muted); line-height: 1.5; margin: 0 0 24px; }
        button { border: 0; border-radius: 999px; padding: 12px 22px; font: inherit; font-weight: 600; background: var(--brand); color: #fff; cursor: pointer; }
    </style>
</head>
<body>
    <main>
        <img src="public/icons/icono-192.png" alt="">
        <h1>Sin conexión</h1>
        <p>KaloAI necesita internet para cargar tu plan y tus recetas. Comprueba la conexión y vuelve a intentarlo.</p>
        <button type="button" onclick="location.reload()">Reintentar</button>
    </main>
</body>
</html>
